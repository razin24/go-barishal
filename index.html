<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Barishal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background-color: #F4F0FB; color: #1B1330; text-align: center; padding: 20px; }
        .btn { background-color: #3F0F8F; color: white; padding: 15px 20px; border: none; border-radius: 12px; font-size: 18px; width: 100%; margin-bottom: 15px; cursor: pointer; }
        .card { background-color: #FFFFFF; padding: 20px; border-radius: 12px; margin-top: 20px; }
        input, select { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Go Barishal</h2>

    <!-- লগইন সেকশন -->
    <div id="login-section" class="card hidden">
        <p>অ্যাপ ব্যবহার করতে Google দিয়ে লগইন করুন</p>
        <button class="btn" onclick="loginWithGoogle()">Google লগইন</button>
    </div>

    <!-- প্রোফাইল তৈরি সেকশন -->
    <div id="profile-section" class="card hidden">
        <h3>আপনার তথ্য দিন</h3>
        <input type="text" id="full_name" placeholder="আপনার নাম">
        <input type="text" id="phone" placeholder="ফোন নম্বর">
        <select id="role">
            <option value="passenger">আমি যাত্রী</option>
            <option value="driver">আমি চালক</option>
        </select>
        <p><input type="checkbox" id="terms"> আমি শর্তাবলী মেনে নিলাম</p>
        <button class="btn" onclick="saveProfile()">সেভ করুন</button>
    </div>

<!-- যাত্রীর ড্যাশবোর্ড -->
    <div id="passenger-dashboard" class="card hidden">
        <h3>কোথায় যাবেন?</h3>
        <select id="pickup">
            <option value="">কোথা থেকে যাবেন?</option>
            <option value="নথুল্লাবাদ">নথুল্লাবাদ</option>
            <option value="রূপাতলী">রূপাতলী</option>
            <option value="সদর রোড">সদর রোড</option>
            <option value="লঞ্চ ঘাট">লঞ্চ ঘাট</option>
            <option value="চৌমাথা">চৌমাথা</option>
            <option value="বাংলা বাজার">বাংলা বাজার</option>
        </select>
        <select id="dropoff">
            <option value="">গন্তব্যস্থল নির্বাচন করুন</option>
            <option value="নথুল্লাবাদ">নথুল্লাবাদ</option>
            <option value="রূপাতলী">রূপাতলী</option>
            <option value="সদর রোড">সদর রোড</option>
            <option value="লঞ্চ ঘাট">লঞ্চ ঘাট</option>
            <option value="চৌমাথা">চৌমাথা</option>
            <option value="বাংলা বাজার">বাংলা বাজার</option>
        </select>
        
        <!-- নতুন বাহন সিলেক্ট অপশন -->
        <select id="vehicle">
            <option value="">কোন বাহনে যাবেন?</option>
            <option value="Bike">বাইক (Bike)</option>
            <option value="CNG">সিএনজি (CNG)</option>
            <option value="Car">গাড়ি (Car)</option>
        </select>

        <input type="number" id="price" placeholder="আপনার ভাড়া প্রস্তাব করুন (টাকা)">
        <button class="btn" onclick="requestRide()">রাইড খুঁজুন</button>
    </div>
    <!-- চালকের ড্যাশবোর্ড -->
    <div id="driver-dashboard" class="card hidden">
        <h3>নতুন রাইড রিকোয়েস্ট</h3>
        <div id="requests-list">
            <p>এখনো কোনো রাইড রিকোয়েস্ট নেই...</p>
        </div>
    </div>

   <script>
        const supabaseUrl = 'https://bgtauxcgptxddbtbaxmx.supabase.co';
        const supabaseKey = 'sb_publishable_IZXzzBSjZzbFrqxnhhus9g_9myHECV8';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;

        async function loginWithGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: 'https://razin24.github.io/go-barishal/' }
            });
            if (error) alert("লগইনে সমস্যা হয়েছে!");
        }

        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                currentUser = user;
                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
                
                if (profile) {
                    if(profile.role === 'passenger') {
                        showSection('passenger-dashboard');
                    } else {
                        showSection('driver-dashboard');
                        fetchRequests();
                    }
                } else {
                    showSection('profile-section');
                }
            } else {
                showSection('login-section');
            }
        }

        async function saveProfile() {
            const fullName = document.getElementById('full_name').value;
            const phone = document.getElementById('phone').value;
            const role = document.getElementById('role').value;
            const terms = document.getElementById('terms').checked;

            if (!terms) { alert("শর্তাবলীতে টিক দিন!"); return; }

            const { error } = await supabaseClient.from('profiles').insert([{
                id: currentUser.id,
                full_name: fullName,
                email: currentUser.email,
                phone: phone,
                role: role,
                accepted_terms_at: new Date().toISOString()
            }]);

            if (error) alert("ডাটাবেস এরর: " + error.message);
            else { alert("প্রোফাইল তৈরি হয়েছে!"); checkUser(); }
        }

       async function requestRide() {
            const pickup = document.getElementById('pickup').value;
            const dropoff = document.getElementById('dropoff').value;
            const vehicle = document.getElementById('vehicle').value;
            const price = document.getElementById('price').value;

            if (!pickup || !dropoff || !vehicle || !price) {
                alert("লোকেশন, বাহন এবং ভাড়া উল্লেখ করুন!"); return;
            }

            const { error } = await supabaseClient.from('rides').insert([{
                passenger_id: currentUser.id,
                pickup_location: pickup,
                dropoff_location: dropoff,
                vehicle_type: vehicle,
                fare: price,
                status: 'pending'
            }]);

            if (error) {
                alert("ডাটাবেস এরর: " + error.message);
            } else {
                alert("আপনার রাইড রিকোয়েস্ট চালকদের কাছে পাঠানো হয়েছে!");
            }
        }
        async function fetchRequests() {
            const { data, error } = await supabaseClient.from('rides').select('*').eq('status', 'pending');
            
            if (data && data.length > 0) {
                let html = '';
                data.forEach(ride => {
                    html += `
                    <div style="border:1px solid #ccc; margin:10px; padding:15px; border-radius:8px; text-align:left;">
                        <p><b>লোকেশন:</b> ${ride.pickup_location} ➡️ ${ride.dropoff_location}</p>
                        <p><b>ভাড়া:</b> ${ride.fare} টাকা</p>
                        <button class="btn" style="background-color: green; margin-bottom: 0;">এক্সেপ্ট করুন</button>
                    </div>`;
                });
                document.getElementById('requests-list').innerHTML = html;
            } else {
                document.getElementById('requests-list').innerHTML = "<p>এখনো কোনো রাইড রিকোয়েস্ট নেই...</p>";
            }
        }

        function showSection(sectionId) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('profile-section').classList.add('hidden');
            document.getElementById('passenger-dashboard').classList.add('hidden');
            document.getElementById('driver-dashboard').classList.add('hidden');
            document.getElementById(sectionId).classList.remove('hidden');
        }

        checkUser();
    </script>
</body>
</html>

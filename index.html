<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Barishal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background-color: #F4F0FB; color: #1B1330; text-align: center; padding: 20px; }
        .btn { background-color: #3F0F8F; color: white; padding: 15px 20px; border: none; border-radius: 12px; font-size: 18px; width: 100%; margin-bottom: 15px; cursor: pointer; }
        .card { background-color: #FFFFFF; padding: 20px; border-radius: 12px; margin-top: 20px; }
        input, select { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Go Barishal</h2>

    <div id="login-section" class="card hidden">
        <p>App bebohar korte Google diye login korun</p>
        <button class="btn" onclick="loginWithGoogle()">Google Login</button>
    </div>

    <div id="profile-section" class="card hidden">
        <h3>Apnar tothyo din</h3>
        <input type="text" id="full_name" placeholder="Apnar nam">
        <input type="text" id="phone" placeholder="Phone number">
        <select id="role">
            <option value="passenger">Ami Jatri</option>
            <option value="driver">Ami Chalok</option>
        </select>
        <p><input type="checkbox" id="terms"> Ami shortaboli mene nilam</p>
        <button class="btn" onclick="saveProfile()">Save korun</button>
    </div>

    <div id="passenger-dashboard" class="card hidden">
        <h3>Kothay jaben?</h3>
        <select id="pickup">
            <option value="">Kotha theke jaben?</option>
            <option value="Nathullabad">Nathullabad</option>
            <option value="Rupatali">Rupatali</option>
            <option value="Sadar Road">Sadar Road</option>
            <option value="Launch Ghat">Launch Ghat</option>
            <option value="Choumatha">Choumatha</option>
            <option value="Bangla Bazar">Bangla Bazar</option>
        </select>
        <select id="dropoff">
            <option value="">Gontobbo nirbachon korun</option>
            <option value="Nathullabad">Nathullabad</option>
            <option value="Rupatali">Rupatali</option>
            <option value="Sadar Road">Sadar Road</option>
            <option value="Launch Ghat">Launch Ghat</option>
            <option value="Choumatha">Choumatha</option>
            <option value="Bangla Bazar">Bangla Bazar</option>
        </select>
        <select id="vehicle">
            <option value="">Kon bahone jaben?</option>
            <option value="Bike">Bike</option>
            <option value="CNG">CNG</option>
            <option value="Car">Car</option>
        </select>
        <input type="number" id="price" placeholder="Bhara prostab korun (Taka)">
        <button class="btn" onclick="requestRide()">Ride khujun</button>
    </div>

    <div id="driver-dashboard" class="card hidden">
        <h3>Notun Ride Request</h3>
        <div id="requests-list">
            <p>Ekhono kono ride request nei...</p>
        </div>
    </div>

    <div id="active-ride-section" class="card hidden">
        <h3 id="active-ride-title">Choloman Ride</h3>
        <div id="active-ride-details" style="text-align: left; padding: 10px;"></div>
        <button id="finish-btn" class="btn hidden" style="background-color: #d32f2f;" onclick="finishRide()">Ride Shesh Korun</button>
        <button id="refresh-btn" class="btn hidden" style="background-color: #1976d2;" onclick="checkCurrentRide()">Status Check Korun</button>
    </div>

   <script>
        const supabaseUrl = 'https://bgtauxcgptxddbtbaxmx.supabase.co';
        const supabaseKey = 'sb_publishable_IZXzzBSjZzbFrqxnhhus9g_9myHECV8';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let currentRole = null;
        let activeRideId = null;

        async function loginWithGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: 'https://razin24.github.io/go-barishal/' }
            });
            if (error) alert("Login e shomossha hoyeche!");
        }

        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                currentUser = user;
                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
                
                if (profile) {
                    currentRole = profile.role;
                    checkCurrentRide();
                } else {
                    showSection('profile-section');
                }
            } else {
                showSection('login-section');
            }
        }

        async function saveProfile() {
            const fullName = document.getElementById('full_name').value;
            const phone = document.getElementById('phone').value;
            const role = document.getElementById('role').value;
            const terms = document.getElementById('terms').checked;

            if (!terms) { alert("Shortabolite tick din!"); return; }

            const { error } = await supabaseClient.from('profiles').insert([{
                id: currentUser.id,
                full_name: fullName,
                email: currentUser.email,
                phone: phone,
                role: role,
                accepted_terms_at: new Date().toISOString()
            }]);

            if (error) alert("Database error: " + error.message);
            else { alert("Profile toiri hoyeche!"); checkUser(); }
        }

        async function requestRide() {
            const pickup = document.getElementById('pickup').value;
            const dropoff = document.getElementById('dropoff').value;
            const vehicle = document.getElementById('vehicle').value;
            const price = document.getElementById('price').value;

            if (!pickup || !dropoff || !vehicle || !price) {
                alert("Location, bahon ebong bhara ullekh korun!"); return;
            }

            const { error } = await supabaseClient.from('rides').insert([{
                passenger_id: currentUser.id,
                pickup_location: pickup,
                dropoff_location: dropoff,
                vehicle_type: vehicle,
                fare: price,
                status: 'pending'
            }]);

            if (error) {
                alert("Database error: " + error.message);
            } else {
                alert("Ride request pathano hoyeche!");
                checkCurrentRide();
            }
        }

        async function checkCurrentRide() {
            if (currentRole === 'passenger') {
                const { data } = await supabaseClient.from('rides').select('*').eq('passenger_id', currentUser.id).in('status', ['pending', 'accepted']).order('created_at', { ascending: false }).limit(1);
                
                if (data && data.length > 0) {
                    const ride = data[0];
                    showActiveRideScreen(ride);
                } else {
                    showSection('passenger-dashboard');
                }
            } else if (currentRole === 'driver') {
                const { data } = await supabaseClient.from('rides').select('*').eq('driver_id', currentUser.id).eq('status', 'accepted').order('created_at', { ascending: false }).limit(1);
                
                if (data && data.length > 0) {
                    showActiveRideScreen(data[0]);
                } else {
                    showSection('driver-dashboard');
                    fetchRequests();
                }
            }
        }

        function showActiveRideScreen(ride) {
            showSection('active-ride-section');
            activeRideId = ride.id;
            
            let statusText = ride.status === 'pending' ? 'Opekkha korun, chalok khonja hocche...' : 'Apnar ride ti accept kora hoyeche!';
            document.getElementById('active-ride-title').innerText = statusText;
            
            document.getElementById('active-ride-details').innerHTML = `
                <p><b>Location:</b> ${ride.pickup_location} ➡️ ${ride.dropoff_location}</p>
                <p><b>Bahon:</b> ${ride.vehicle_type}</p>
                <p><b>Bhara:</b> ${ride.fare} Taka</p>
            `;

            if (currentRole === 'driver') {
                document.getElementById('finish-btn').classList.remove('hidden');
                document.getElementById('refresh-btn').classList.add('hidden');
            } else {
                document.getElementById('finish-btn').classList.add('hidden');
                if (ride.status === 'pending') {
                    document.getElementById('refresh-btn').classList.remove('hidden');
                } else {
                    document.getElementById('refresh-btn').classList.add('hidden');
                }
            }
        }

        async function fetchRequests() {
            const { data, error } = await supabaseClient.from('rides').select('*').eq('status', 'pending');
            
            if (data && data.length > 0) {
                let html = '';
                data.forEach(ride => {
                    html += `
                    <div style="border:1px solid #ccc; margin:10px; padding:15px; border-radius:8px; text-align:left;">
                        <p><b>Location:</b> ${ride.pickup_location} ➡️ ${ride.dropoff_location}</p>
                        <p><b>Bahon:</b> ${ride.vehicle_type}</p>
                        <p><b>Bhara:</b> ${ride.fare} Taka</p>
                        <button class="btn" style="background-color: green; margin-bottom: 0;" onclick="acceptRide('${ride.id}')">Accept Korun</button>
                    </div>`;
                });
                document.getElementById('requests-list').innerHTML = html;
            } else {
                document.getElementById('requests-list').innerHTML = "<p>Ekhono kono ride request nei...</p>";
            }
        }

        async function acceptRide(rideId) {
            const { error } = await supabaseClient.from('rides').update({ status: 'accepted', driver_id: currentUser.id }).eq('id', rideId);
            if (error) alert("Database error: " + error.message);
            else { checkCurrentRide(); }
        }

        async function finishRide() {
            if (!activeRideId) return;
            const { error } = await supabaseClient.from('rides').update({ status: 'completed' }).eq('id', activeRideId);
            if (error) alert("Database error: " + error.message);
            else {
                alert("Ride shesh hoyeche!");
                activeRideId = null;
                checkCurrentRide();
            }
        }

        function showSection(sectionId) {
            ['login-section', 'profile-section', 'passenger-dashboard', 'driver-dashboard', 'active-ride-section'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(sectionId).classList.remove('hidden');
        }

        checkUser();
    </script>
</body>
</html>
